name: Build and Release Extension

on:
  push: { tags: [v*] }
  workflow_dispatch:
    inputs:
      version: { description: "Version tag (e.g., v4.0.1)", required: false }

env:
  NODE_VERSION: 24
  GO_VERSION: 1.26
  BUN_VERSION: 1.3.12

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }

      - name: Setup Go
        uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    needs: test
    outputs: { version: "${{ steps.get-version.outputs.version }}" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }

      - name: Setup Go
        uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint:js

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION="$(yq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Build Chrome WXT output
        run: bun run build:chrome

      - name: Build Firefox WXT output
        run: bun run build

      - name: Run web-ext lint (Firefox)
        working-directory: .output/firefox-mv3
        run: bunx web-ext lint -s .

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Agent Bridge companions
        working-directory: native
        run: |
          mkdir -p ../dist

          build_bridge() {
            local goos="$1"
            local goarch="$2"
            local archive_name="$3"
            local stage_dir="../dist/.agent-bridge-${goos}-${goarch}"
            local cli_name="snipsnip"
            local host_name="snipsnip-native-host"

            rm -rf "$stage_dir"
            mkdir -p "$stage_dir"

            if [ "$goos" = "windows" ]; then
              cli_name="${cli_name}.exe"
              host_name="${host_name}.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" go build -o "${stage_dir}/${cli_name}" ./cmd/snipsnip
            GOOS="$goos" GOARCH="$goarch" go build -o "${stage_dir}/${host_name}" ./cmd/snipsnip-native-host
            cp README.md "${stage_dir}/README.md"

            if [ "$goos" = "windows" ]; then
              (cd "$stage_dir" && zip -r "../${archive_name}" .)
            else
              (cd "$stage_dir" && tar -czf "../${archive_name}" .)
            fi

            rm -rf "$stage_dir"
          }

          build_bridge windows amd64 snipsnip-agent-bridge-windows-amd64.zip
          build_bridge darwin amd64 snipsnip-agent-bridge-macos-amd64.tar.gz
          build_bridge darwin arm64 snipsnip-agent-bridge-macos-arm64.tar.gz
          build_bridge linux amd64 snipsnip-agent-bridge-linux-amd64.tar.gz

      - name: Create Chrome package (.zip)
        working-directory: .output/chrome-mv3
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          zip -r "../../dist/snipsnip-chrome-${VERSION}.zip" . \
            -x "*.DS_Store"

      - name: Create Firefox package (.xpi)
        working-directory: .output/firefox-mv3
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          zip -r "../../dist/snipsnip-firefox-${VERSION}.xpi" . \
            -x "*.DS_Store"

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: snipsnip-chrome
          path: dist/snipsnip-chrome-${{ steps.get-version.outputs.version }}.zip
          retention-days: 30

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: snipsnip-firefox
          path: dist/snipsnip-firefox-${{ steps.get-version.outputs.version }}.xpi
          retention-days: 30

      - name: Upload Agent Bridge artifact
        uses: actions/upload-artifact@v7
        with:
          name: snipsnip-agent-bridge
          path: |
            dist/snipsnip-agent-bridge-windows-amd64.zip
            dist/snipsnip-agent-bridge-macos-amd64.tar.gz
            dist/snipsnip-agent-bridge-macos-arm64.tar.gz
            dist/snipsnip-agent-bridge-linux-amd64.tar.gz
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions: { contents: write }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Chrome artifact
        uses: actions/download-artifact@v8
        with:
          name: snipsnip-chrome
          path: ./artifacts

      - name: Download Firefox artifact
        uses: actions/download-artifact@v8
        with:
          name: snipsnip-firefox
          path: ./artifacts

      - name: Download Agent Bridge artifact
        uses: actions/download-artifact@v8
        with:
          name: snipsnip-agent-bridge
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Get tag name
        id: get-tag
        env:
          EVENT_VERSION: ${{ github.event.inputs.version }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -n "$EVENT_VERSION" ]; then
            TAG="$EVENT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${BUILD_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          VERSION="${TAG}"
          VERSION="${VERSION#v}"

          CHANGELOG_ENTRY="$(awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -n "$CHANGELOG_ENTRY" ]; then
            CHANGELOG_ENTRY="$(printf '%s\n' "$CHANGELOG_ENTRY" | sed '/./,$!d')"
          else
            CHANGELOG_ENTRY="- No changelog entry found for version $VERSION."
          fi

          {
            echo "changes<<EOF"
            printf '%s\n' "$CHANGELOG_ENTRY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: SnipSnip ${{ steps.get-tag.outputs.tag }}
          body: |
            ## SnipSnip ${{ steps.get-tag.outputs.tag }}

            ### Installation

            **Chrome:**
            1. Download `snipsnip-chrome-${{ needs.build.outputs.version }}.zip`
            2. Go to `chrome://extensions/`
            3. Enable "Developer mode"
            4. Click "Load unpacked" and select the extracted folder
            5. Or drag and drop the .zip file to install

            **Firefox:**
            1. Download `snipsnip-firefox-${{ needs.build.outputs.version }}.xpi`
            2. Open Firefox and drag the .xpi file into the browser
            3. Confirm the installation

            **Agent Bridge (choose the archive for your OS):**
            - Windows x64: `snipsnip-agent-bridge-windows-amd64.zip`
            - macOS Intel: `snipsnip-agent-bridge-macos-amd64.tar.gz`
            - macOS Apple Silicon: `snipsnip-agent-bridge-macos-arm64.tar.gz`
            - Linux x64: `snipsnip-agent-bridge-linux-amd64.tar.gz`

            After extracting the archive:
            - Windows: run `.\snipsnip.exe install-host`
            - macOS/Linux: run `./snipsnip install-host`
            - Then enable **Agent Bridge** in the extension settings

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for all version changes.

          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.xpi
          draft: false
          prerelease: false
