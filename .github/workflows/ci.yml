name: CI

on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

env:
  NODE_VERSION: 24
  GO_VERSION: 1.26
  BUN_VERSION: 1.3.13

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run deterministic E2E tests
        run: |
          xvfb-run -a npx playwright test \
            --config src/playwright.config.js \
            src/tests/e2e/extension.spec.js \
            src/tests/e2e/notifications.spec.js \
            src/tests/e2e/batch-processing.spec.js \
            src/tests/e2e/command-download-regression.spec.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint:js

      - name: Build Firefox WXT output
        run: bun run build:wxt:firefox

      - name: Run web-ext lint (Firefox)
        working-directory: .output/firefox-mv3
        run: bunx web-ext lint -s .
